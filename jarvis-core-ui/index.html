<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // Autonomous AI Core</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 3D Holographic Neural Particle Core -->
    <div id="orb-canvas-container"></div>

    <!-- Minimalist Interface Overlay -->
    <div class="ui-overlay">
        
        <!-- Top Bar -->
        <header class="top-bar interactive">
            <div class="brand-tag">J.A.R.V.I.S. <span>//</span> AI</div>
            <button class="icon-btn" id="settings-btn" title="AI Configuration & API Settings">
                <!-- Clean Gear SVG Icon -->
                <svg viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </header>

        <!-- Bottom Section: Status & Controls -->
        <div class="bottom-section interactive">
            
            <!-- Dynamic Status / Transcript Text -->
            <div class="status-text-container">
                <div class="status-text idle" id="status-text">Say something...</div>
            </div>

            <!-- Optional Text Prompt Drawer -->
            <div class="text-drawer" id="text-drawer">
                <input type="text" class="text-input" id="text-input" placeholder="Type a message or prompt...">
                <button class="send-btn" id="send-text-btn" title="Send">↑</button>
            </div>

            <!-- Minimalist Action Buttons -->
            <div class="action-controls">
                
                <!-- Cancel / Stop Button -->
                <button class="circle-btn" id="cancel-btn" title="Cancel / Stop">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>

                <!-- Voice Mic Button -->
                <button class="circle-btn mic-btn" id="mic-btn" title="Click to Speak">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
                    </svg>
                </button>

                <!-- Keyboard Toggle Button -->
                <button class="circle-btn" id="text-toggle-btn" title="Toggle Text Prompt Input">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/>
                    </svg>
                </button>

            </div>

        </div>

    </div>

    <!-- AI & API Settings Modal -->
    <div class="modal-backdrop" id="settings-modal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">AI CORE CONFIGURATION</div>
                <button class="close-btn" id="close-settings-btn">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">LLM Provider</label>
                <select class="form-select" id="provider-select">
                    <option value="gemini">Google Gemini API (Recommended)</option>
                    <option value="openai">OpenAI API (ChatGPT)</option>
                </select>
            </div>

            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label">API Key</label>
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="form-link" id="api-key-help-link">Get Free Gemini API Key ↗</a>
                </div>
                <div class="input-with-action">
                    <input type="password" class="form-input" id="api-key-input" placeholder="Paste your API key here (e.g. AIzaSy...)">
                    <button type="button" class="action-icon-btn" id="toggle-key-visibility" title="Show/Hide API Key">
                        <svg id="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Model Selection</label>
                <select class="form-select" id="model-select">
                    <!-- Populated dynamically based on provider -->
                </select>
                <input type="text" class="form-input" id="model-input" placeholder="Enter custom model ID" style="display: none; margin-top: 6px;">
            </div>

            <div class="form-group">
                <label class="form-label">System Persona Prompt</label>
                <textarea class="form-textarea" id="system-prompt-input" rows="3" placeholder="Define how JARVIS should respond..."></textarea>
            </div>

            <!-- Test Connection Row -->
            <div class="test-connection-section">
                <button type="button" class="secondary-btn" id="test-connection-btn">
                    <span class="btn-spinner" id="test-spinner" style="display: none;"></span>
                    <span id="test-btn-text">Test API Connection</span>
                </button>
                <div class="connection-status-badge idle" id="connection-status-badge">Not tested</div>
            </div>

            <button class="save-btn" id="save-settings-btn">Save Configuration</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="audio.js"></script>
    <script src="orb.js"></script>
    <script src="app.js"></script>
</body>
</html>
